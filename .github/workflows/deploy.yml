name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        default: development
        options:
          - development
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ vars.ACR_REGISTRY }}
  REPOSITORY: content-management-api
  DOCKERFILE_PATH: Content.Management.Api/Dockerfile

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.run_number }} \
            -f ${{ env.DOCKERFILE_PATH }} \
            .
          docker push ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.run_number }}

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          chmod +x deploy/deploy-${{ github.event.inputs.environment }}.sh
          ./deploy/deploy-${{ github.event.inputs.environment }}.sh ${{ github.run_number }}
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
